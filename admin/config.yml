backend:
  name: github
  repo: syuniody/juku-hp-template-01
  branch: main
  base_url: https://api.netlify.com

media_folder: "images/blog"
public_folder: "/images/blog"

locale: "ja"

collections:
  - name: "blog"
    label: "ブログ記事"
    folder: "blog/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{fields.slug}}"
    identifier_field: "title"
    fields:
      - { label: "タイトル", name: "title", widget: "string" }
      - { label: "スラッグ（URL用・半角英数）", name: "slug", widget: "string", hint: "URLに使う英数字の名前（例: exam-tips-2026）" }
      - { label: "公開日", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "カテゴリ", name: "category", widget: "select", options: ["学習法", "教室ニュース", "受験情報", "イベント"] }
      - { label: "アイキャッチ画像", name: "thumbnail", widget: "image", required: false }
      - { label: "概要", name: "description", widget: "text", required: false }
      - { label: "本文", name: "body", widget: "markdown" }

  - name: "success"
    label: "合格体験記"
    files:
      - label: "合格体験記一覧"
        name: "stories"
        file: "success/stories.json"
        format: "json"
        fields:
          - label: "体験記"
            name: "stories"
            widget: "list"
            summary: "{{fields.year}}年度｜{{fields.school}}｜{{fields.name}}"
            fields:
              - { label: "公開する", name: "published", widget: "boolean", default: true }
              - { label: "年度", name: "year", widget: "number", value_type: "int", default: 2026 }
              - label: "受験区分"
                name: "category"
                widget: "select"
                options:
                  - { label: "中学受験・中高一貫校", value: "junior" }
                  - { label: "高校受験", value: "high" }
              - { label: "合格校", name: "school", widget: "string" }
              - { label: "氏名・イニシャル", name: "name", widget: "string", required: false }
              - { label: "タイトル", name: "title", widget: "string" }
              - { label: "本文", name: "body", widget: "markdown", hint: "強調したい文章は **本文** のように囲むと、ページ上で太字表示になります。" }
              - { label: "表示順", name: "order", widget: "number", value_type: "int", required: false }
